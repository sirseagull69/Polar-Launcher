plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "de.selbstgfaltet.polarlicht"
    compileSdk 34

    defaultConfig {
        applicationId "de.selbstgfaltet.polarlicht"
        minSdk 26
        targetSdk 34
        // Die Build-Nummer von GitHub ist die Versionsnummer, an der die App Updates erkennt.
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer)
        versionName "0.17.6"
    }

    // Fester Schlüssel, damit sich neue Versionen über alte installieren lassen.
    signingConfigs {
        debug {
            storeFile rootProject.file("polarlicht-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // Dex unkomprimiert und ausgerichtet: Pflicht, damit Ori im eigenen OS als vorab signierte System-App eingebaut werden kann
    packagingOptions {
        dex { useLegacyPackaging false }
        jniLibs { useLegacyPackaging false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Startbildschirm und Bedienfeld: Jetpack Compose mit Material 3, Googles Baukasten für die Pixel-Oberflächen.
dependencies {
    implementation platform("androidx.compose:compose-bom:2024.09.00")
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.activity:activity-compose:1.9.2"
}

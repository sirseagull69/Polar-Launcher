plugins {
    id "com.android.application"
}

android {
    namespace "de.selbstgfaltet.polarlicht"
    compileSdk 34

    defaultConfig {
        applicationId "de.selbstgfaltet.polarlicht"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    // Fester Schlüssel, damit sich neue Versionen über alte installieren lassen.
    signingConfigs {
        debug {
            storeFile rootProject.file("polarlicht-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

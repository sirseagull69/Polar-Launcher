name: APK bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Release mit der APK anlegen
        type: boolean
        default: true
      vorschau:
        description: App im Emulator starten und Bildschirmfotos ablegen
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk polarlicht.apk

      - uses: actions/upload-artifact@v4
        with:
          name: polarlicht-apk
          path: polarlicht.apk

      - name: Release mit der APK anlegen
        if: github.event_name != 'workflow_dispatch' || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Polarlicht Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Automatisch gebaute Testversion. Noch nicht auf einem Gerät geprüft.
          files: polarlicht.apk

  vorschau:
    if: github.event_name == 'workflow_dispatch' && inputs.vorschau
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: polarlicht-apk

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: bash tools/vorschau.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vorschau
          path: shots/
